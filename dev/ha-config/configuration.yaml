# Home Assistant config for the throwaway DEV instance only (docker-compose.yml).
# Not shipped to users, not related to anyone's real setup.

default_config:

homeassistant:
  # A card reads `hass.config.time_zone`, not the container clock, so pin it here.
  # Follows the TZ that docker-compose passes in, which keeps the two in sync.
  time_zone: !env_var TZ Europe/Warsaw
  country: PL

# Gives us entities to develop against without configuring any real integration:
# calendar.calendar_1 / calendar.calendar_2, plus assorted sensors.
# For richer calendar work add the "Local Calendar" integration in the UI --
# it is writable, so events can be created from the card.
#
# It has no `todo` platform at all, so the calendar card's reminders have nothing to read
# here until the "Local To-do" integration is added in the UI -- it is config-flow only and
# cannot be set up from this file. Add a list, then give an item a due date: only the dated
# ones reach the card, which is the rule that is worth seeing work.
demo:

# Devices for the battery card, because `demo:` has almost nothing it can use: two
# battery sensors, both `entity_category: diagnostic`, both at a fixed level and neither
# ever charging. Not enough to fill the six rings the wide footprint holds, and not enough
# to reach a single one of the card's branches.
#
# So: one device per branch, mirroring `dev/battery-devices.ts` so that a card looks the
# same here as it does in the showcase. The three ways an integration reports charging are
# one each -- a separate binary sensor, `is_charging`, `battery_state` -- because only the
# first of them has to be named in the card's config and the other two are what the card
# reads for free. The last two are the unhappy paths: no icon of its own, and not
# reporting at all.
#
# `sensor.dev_creeping_battery` is the one that moves. Template sensors re-render on the
# minute whenever `now()` is in them, so its arc visibly advances while you watch -- which
# is the only way to see that the card repaints on a state change rather than on a config
# one.
template:
  - sensor:
      - name: Dev phone battery
        unique_id: dev_phone_battery
        device_class: battery
        unit_of_measurement: '%'
        state: '72'
        icon: mdi:cellphone
      - name: Dev watch battery
        unique_id: dev_watch_battery
        device_class: battery
        unit_of_measurement: '%'
        state: '41'
        icon: mdi:watch
        attributes:
          battery_state: Charging
      - name: Dev earbuds battery
        unique_id: dev_earbuds_battery
        device_class: battery
        unit_of_measurement: '%'
        state: '8'
        icon: mdi:headphones
      - name: Dev tablet battery
        unique_id: dev_tablet_battery
        device_class: battery
        unit_of_measurement: '%'
        state: '100'
        icon: mdi:tablet
      - name: Dev laptop battery
        unique_id: dev_laptop_battery
        device_class: battery
        unit_of_measurement: '%'
        state: '63'
        icon: mdi:laptop
        attributes:
          is_charging: true
      # No icon: the card falls back to a battery glyph, which is what a real battery
      # sensor looks like when nobody has named the device.
      - name: Dev remote battery
        unique_id: dev_remote_battery
        device_class: battery
        unit_of_measurement: '%'
        state: '22'
      # `availability: false` is how a template sensor is made `unavailable` -- an empty
      # state template only gets you `unknown`, which the card treats the same way but
      # which is not the state an integration that has stopped answering produces.
      - name: Dev doorbell battery
        unique_id: dev_doorbell_battery
        device_class: battery
        unit_of_measurement: '%'
        state: '15'
        icon: mdi:doorbell-video
        availability: 'false'
      - name: Dev creeping battery
        unique_id: dev_creeping_battery
        device_class: battery
        unit_of_measurement: '%'
        state: '{{ now().minute | int }}'
        icon: mdi:battery-clock
  - binary_sensor:
      # The one form of charging that has to be named in the card's config, since it is
      # not on the battery sensor at all: `charging_entity: binary_sensor.dev_tablet_charging`.
      - name: Dev tablet charging
        unique_id: dev_tablet_charging
        device_class: battery_charging
        state: 'true'

lovelace:
  # Dashboards stay in storage mode (the default), so the UI card picker and
  # visual editors work. But resources are pinned here declaratively, so the
  # dev bundle is registered on boot with no manual clicking.
  #
  # `resource_mode` is a separate knob from the dashboard `mode`; setting it
  # explicitly also survives 2026.8, which drops the fallback to `mode`.
  resource_mode: yaml
  resources:
    # ./dist is bind-mounted to /config/www/cupertino-widgets by docker-compose,
    # so `pnpm watch` output is served straight from here.
    #
    # The `?v=` is load-bearing, and a hard reload is not a substitute for bumping it.
    # Two caches sit in front of this file and cover for each other: Home Assistant
    # serves /local/ with `Cache-Control: public, max-age=2678400` (31 days), and the
    # frontend's service worker catches everything else in a StaleWhileRevalidate
    # "file-cache" (its last route is `registerRoute(/\/.*/, …)`). A shift-reload
    # bypasses the service worker for the document but not for its subresources, so the
    # SW keeps answering from its copy, and the revalidation it fires in the background
    # is itself served by the 31-day HTTP entry. Changing the URL misses both.
    #
    # Bump this when the browser will not let go of an old bundle, then:
    #   pnpm ha:up
    # NOT `docker compose restart`: that keeps the existing container, and on Docker
    # Desktop its bind mount of ./dist comes back stale: the container ends up seeing an
    # empty directory and serving 404 for a bundle that is sitting right there on the
    # host. `ha:up` force-recreates, which re-resolves the mount. Same failure the README
    # warns about for `rm -rf dist`, reached by a different route.
    - url: /local/cupertino-widgets/cupertino-widgets.js?v=19
      type: module
