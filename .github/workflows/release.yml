name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          package_tag="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$package_tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match $package_tag from package.json"
            exit 1
          fi

      - run: pnpm run build

      - name: Attach the bundle to the release
        # HACS downloads `filename` from hacs.json out of the release assets.
        uses: softprops/action-gh-release@v3
        with:
          files: dist/cupertino-widgets.js
          generate_release_notes: true
